<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f0e8">
<title>汤圆工作台 · 把日子慢慢过好</title>
<meta name="description" content="汤圆工作台，记录生活、学习与每一份小小的坚持。">
<style>
/* 汤圆工作台 · 奶油咖与雾蓝。沿用原有记录与交互，仅调整视觉。 */
:root{
 color-scheme:light;
 --bg:#f5f0e8;--paper:#fffdf8;--raised:#f0e8dd;--line:#e2d8cb;
 --coffee:#775b46;--blue-soft:#dce6ea;
 --ink:#574334;--muted:#8a7768;--deep:#587b8e;--accent:#698c9d;
 --mint:#698c9d;--yellow:#c8dbe3;--radius:20px;--sidebar:224px;
 --shadow:0 8px 24px #88725a12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:10px;padding:9px 14px;transition:background .18s,border-color .18s}
button:hover{background:#e9f0f2;border-color:#b1c7d0}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
button.primary{background:#765b48;border-color:#765b48;color:#fffaf3;font-weight:700;box-shadow:0 3px 0 #594333}
button.primary:hover{background:#896c56;border-color:#896c56}
button.soft{background:#e9f0f2;border-color:#b1c7d0;color:#587b8e}
button.small{padding:6px 11px;font-size:12px}
button.danger{color:#b9566e}
h1,h2,h3,p{margin:0}
h1{font-size:30px;letter-spacing:.5px;line-height:1.5;color:#574334;font-weight:750}
h2{font-size:17px;font-weight:700}h3{font-size:15px}
small,.muted{color:var(--muted);font-size:12px}
a{color:var(--deep)}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.sidebar{width:var(--sidebar);position:fixed;inset:0 auto 0 0;background:#eee6da;border-right:1px solid #ddcfbe;padding:27px 16px 21px;display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750;letter-spacing:.4px;white-space:nowrap;padding:0 6px}
.brand-mark{width:35px;height:35px;background:#e3d2be;border:1px solid #cebaa5;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.brand-mark svg{width:30px;height:30px}
.brand-caption{font-size:10px;color:#9b8571;letter-spacing:1px;padding-left:51px;margin-top:4px}
.profile{display:grid;grid-template-columns:45px minmax(0,1fr);column-gap:11px;align-items:center;background:#f8f3eb;border:1px solid #dfd1bf;border-radius:17px;margin:28px 0 27px;padding:15px 12px}
.avatar{width:45px;height:45px;display:grid;place-items:center;border-radius:50%;background:#e5d5c1;grid-row:span 2}
.avatar svg{width:42px;height:42px}
.profile-name{font-weight:700;font-size:14px;overflow-wrap:anywhere;align-self:end}
.profile small{display:block;font-size:11px;align-self:start;color:#8a7768;margin-top:2px}
.profile button{grid-column:1/-1;margin-top:13px;background:transparent;border-color:#d4c1ad;font-size:11px;color:#587b8e;padding:6px}
.nav-label{padding:0 13px;margin-bottom:12px;color:#8a7768;font-size:11px;letter-spacing:1px}
.nav{display:grid;gap:8px}
.nav button{display:flex;align-items:center;width:100%;gap:12px;padding:13px;border:1px solid transparent;border-radius:12px;text-align:left;background:transparent;color:#8a7768;position:relative;font-size:14px}
.nav button:hover{background:#f0e8dd;color:#574334}
.nav button.active{background:#628092;border-color:#628092;color:#fffaf4;font-weight:700;box-shadow:0 5px 14px #556a7420}
.nav-icon{width:23px;height:23px;display:grid;place-items:center}
.nav-num{margin-left:auto;font-size:10px;color:#8a7768;font-variant-numeric:tabular-nums}
.nav button.active .nav-num{color:#dce8ed}
.side-bottom{margin-top:auto;padding:35px 10px 0}
.side-quote{color:#8a7768;font-size:11px;display:flex;gap:8px;align-items:center}
.side-quote span{color:#8a7768;font-size:16px}
.side-note{margin-top:17px;border-top:1px solid #e2d8cb;padding-top:15px;color:#8a7768;font-size:10px;line-height:1.9}
.main{margin-left:var(--sidebar);padding:29px 36px 18px;max-width:1712px}
.page-top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:23px}
.eyebrow{font-size:11px;letter-spacing:1px;color:#8a7768;margin-bottom:3px}
.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.top-actions button{font-size:12px;padding:9px 14px}
.top-actions [data-action=settings]{background:#765b48;border-color:#765b48;color:#fffaf3;font-weight:700;box-shadow:0 3px 0 #594333}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#e9f0f2;color:#587b8e;border:1px solid #b1c7d0;border-radius:8px;font-size:11px;white-space:nowrap;font-weight:500}
.pill.mint{background:#e9f0f2;border-color:#b1c7d0;color:#587b8e}
.pill.warning{background:#fff4ef;border-color:#e5b6a5;color:#a2513b}
.pill.pink,.pill.blue{background:#e9f0f2;border-color:#b1c7d0;color:#587b8e}
.local-pill{border:0;background:transparent!important;font-size:11px;color:#8a7768}
.intro{display:flex;justify-content:space-between;align-items:center;gap:24px;min-height:224px;margin:0 0 29px;padding:27px 32px;background:#eee2d2;border:1px solid #d9c7b2;border-radius:22px;position:relative;overflow:hidden}
.intro:after{content:"";width:235px;height:235px;position:absolute;right:32px;top:-5px;border-radius:90px 90px 12px 12px;background:#d5e2e7;border:1px solid #c0cfd1;pointer-events:none}
.intro-copy{min-width:0;position:relative;z-index:1}
.intro-kicker{font-size:11px;letter-spacing:1px;color:#8a7768;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.intro-kicker:before{content:"";width:6px;height:6px;border-radius:50%;background:#9a7558}
.intro strong{display:block;font-size:32px;line-height:1.4;letter-spacing:1px;color:#574334;font-weight:750}
.intro strong span{color:#587b8e}
.intro p{font-size:12px;color:#8a7768;margin-top:10px}
.hero-mascot{width:242px;height:174px;flex-shrink:0;margin-right:0;position:relative;z-index:1;pointer-events:none}
/* 分页把日期收成工具条，让记录、表单和图表成为第一视觉。 */
body:not([data-page="overview"]) .intro{min-height:0;padding:15px 20px;margin-bottom:23px;border-radius:15px;background:#ede5d9;border-color:#ddd0bf}
body:not([data-page="overview"]) .intro:after,body:not([data-page="overview"]) .intro-kicker,body:not([data-page="overview"]) #greeting,body:not([data-page="overview"]) .hero-mascot{display:none}
body:not([data-page="overview"]) .intro-copy{display:flex;align-items:center;justify-content:space-between;gap:15px;width:100%;flex-wrap:wrap}
body:not([data-page="overview"]) .intro p{margin:0;font-size:12px}
body:not([data-page="overview"]) .date-control{padding:0;margin:0;border:0;background:transparent}
.date-control{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap;padding:9px 12px;background:#f8f2e9;border:1px solid #d4c2ac;border-radius:13px;width:max-content;max-width:100%}
.date-caption{font-size:11px;color:#8a7768;margin-right:4px}
.date-control input{width:145px;background:#fffaf3;border-color:#d7c7b4;font-size:12px;padding:7px 8px;border-radius:8px}
.date-control button{font-size:11px;background:#dbe6e9;border-color:#aabfc9;color:#587b8e;padding:7px 11px}
.section-label{font-size:17px;font-weight:700;color:#574334;margin:28px 0 15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.section-label:before{content:"";width:5px;height:17px;border-radius:3px;background:var(--accent)}
.section-label .muted{font-size:11px;font-weight:400;margin-left:4px;color:#8a7768}
.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:28px}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:21px;position:relative;min-width:0}
.card.striped{overflow:hidden}
.stats .card{padding:21px 22px;min-height:174px;border-radius:19px}
.stats .card:first-child{background:#816650;border-color:#816650;box-shadow:0 7px 22px #70553b1c}
.stats .card:first-child .stat-label,.stats .card:first-child .stat-value span,.stats .card:first-child .stat-foot{color:#f2e4d3}
.stats .card:first-child .stat-icon{color:#f7ead9;background:#ffffff1c;border-radius:10px;padding:7px}
.stats .card:first-child .progress{background:#ad927a}
.stats .card:first-child .progress i{background:#c8dde4}
.stat-label{font-size:13px;font-weight:500;color:#8a7768;display:flex;justify-content:space-between;gap:8px;align-items:center}
.stat-icon{color:#587b8e;display:grid;place-items:center;background:#e9f0f2;border-radius:10px;padding:7px}
.stat-icon .icon{width:19px;height:19px}
.stat-value{color:#587b8e;font-size:38px;font-weight:750;line-height:1.2;margin-top:15px;font-variant-numeric:tabular-nums;letter-spacing:-1px;overflow-wrap:anywhere}
.stats .card:first-child .stat-value{color:#fff8ec}
.stat-value span{font-size:12px;font-weight:400;color:#8a7768;letter-spacing:0;margin-left:6px}
.stat-foot{font-size:11px;color:#8a7768;margin-top:10px;line-height:1.7}
.progress{height:6px;background:#dbe6e9;border-radius:9px;overflow:hidden;margin-top:17px}
.progress i{height:100%;display:block;background:#698c9d;border-radius:8px;transition:width .3s}
.progress.mint i{background:#698c9d}.progress.yellow i{background:#b49a7c}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-grid{grid-template-columns:1.45fr 1fr}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:19px;flex-wrap:wrap}
.card-title h2{display:flex;align-items:center;gap:9px}
.title-icon{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:#e1e9eb;color:#587b8e;flex-shrink:0}
.title-icon .icon{width:17px;height:17px}
.card-title .link{font-size:11px;border:0;background:transparent;padding:5px 0;color:#587b8e;white-space:nowrap}
.mini-line{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid #e2d8cb;font-size:12px;color:#8a7768}
.mini-line:last-child{border:0}.mini-line strong{font-variant-numeric:tabular-nums;color:#574334;font-weight:600}
.plan-big{font-size:32px;color:#587b8e;font-weight:750;margin:6px 0 15px;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.plan-big small{font-weight:400;font-size:11px;letter-spacing:0;margin-left:2px}
.quote-card{margin-top:15px;padding:10px 0 0;border-top:1px solid #e8dece;color:#9b8875;font-size:11px;line-height:1.8}
.habit-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.habit-chip{display:flex;align-items:center;gap:7px;border-radius:10px;padding:8px 11px;font-size:12px;background:#f0e8dd;color:#8a7768}
.habit-chip.checked{background:#e9f0f2;border-color:#b1c7d0;color:#587b8e}
.check-bubble{width:19px;height:19px;flex-shrink:0;border:1px solid #b1c7d0;border-radius:6px;display:grid;place-items:center;color:#587b8e;font-size:11px}
.week-bars{display:flex;align-items:flex-end;gap:13px;height:106px;margin-top:16px}
.week-bar{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%;font-size:10px;color:#8a7768}
.week-bar .track{height:67px;background:#dbe6e9;border-radius:7px;display:flex;align-items:flex-end;overflow:hidden;margin:7px 0}
.week-bar i{display:block;width:100%;min-height:2px;background:#698c9d;border-radius:5px}
.week-bar.today i{background:#c8dbe3}.week-bar.today{color:#587b8e}.week-bar.future{opacity:.4}
.welcome-sticker{display:none}
.self-note{line-height:2.2;font-size:13px;color:#8a7768;margin-top:8px}
.panel-gap{margin-top:18px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.form-grid.three-fields{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}
label.field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#8a7768}
input,select,textarea{width:100%;border:1px solid #e2d8cb;background:#fffdf8;border-radius:10px;padding:10px 11px;color:var(--ink);min-width:0}
input::placeholder,textarea::placeholder{color:#8a7768}
textarea{resize:vertical;min-height:95px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
input[type=color]{height:40px}
.form-actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:5px}
.form-message{font-size:10px;color:#8a7768;margin-right:auto}
.chart-box{height:235px;position:relative;width:100%;min-width:0}
.chart-box canvas{width:100%!important;height:100%!important}
.chart-box svg{width:100%;height:100%;display:block}
.chart-note{font-size:10px;color:#8a7768;margin-top:12px;line-height:1.85}
.empty{padding:32px 12px;text-align:center;color:#8a7768;font-size:12px}
.empty .empty-icon{display:block;width:43px;height:43px;line-height:43px;background:#e9f0f2;color:#8a7768;border-radius:15px;margin:0 auto 12px;font-size:23px}
.table-wrap{overflow:auto;scrollbar-width:thin}
table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap;text-align:left}
th{font-weight:500;color:#8a7768;background:#e9f0f2;padding:12px 13px}
td{padding:13px;border-bottom:1px solid #e2d8cb;color:#8a7768}
td.wrap{white-space:normal;min-width:110px;max-width:260px;overflow-wrap:anywhere}
tbody tr:hover{background:#e9f0f2}
.tabs{display:inline-flex;max-width:100%;gap:5px;margin-bottom:21px;padding:4px;background:#e9f0f2;border:1px solid var(--line);border-radius:12px}
.tabs button{font-size:12px;border-radius:8px;padding:8px 19px;border-color:transparent;background:transparent;color:#8a7768}
.tabs button.active{background:#628092;border-color:#628092;color:#fffaf4;font-weight:700}
.countdown{background:#e9f0f2;border-color:#b1c7d0}
.countdown-number{font-size:54px;font-weight:700;line-height:1.2;color:#587b8e;margin:19px 0;font-variant-numeric:tabular-nums}
.countdown-number small{font-size:12px;margin-left:10px}
.subject-row{margin-top:19px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.subject-row .row-between{font-size:12px}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:25px}
.stage{border-top:2px solid #dbe6e9;padding:16px 0 0;position:relative;min-width:0}
.stage:before{content:"";position:absolute;top:-6px;left:0;width:10px;height:10px;border-radius:50%;background:#c9b5a1}
.stage.current:before{background:#779aab;box-shadow:0 0 0 4px #dbe6e9}
.stage.current{border-color:#779aab}
.stage p{font-size:10px;color:#8a7768;margin-top:7px}
.tasks{display:grid;gap:9px}
.task{display:flex;align-items:center;gap:10px;padding:11px;background:#f0e8dd;border-radius:10px;border:1px solid #b1c7d0}
.task .task-text{flex:1;overflow-wrap:anywhere;font-size:12px}
.task.done .task-text{text-decoration:line-through;color:#8a7768}
.icon-btn{padding:4px 7px;border:0;background:transparent;color:#8a7768;font-size:17px}
.subject-card .subject-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.subject-card p{font-size:12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;color:#8a7768}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.calendar .weekday{text-align:center;color:#8a7768;font-size:11px;padding:8px 0}
.day{padding:10px 2px;min-height:60px;border-radius:10px;border:1px solid #b1c7d0;background:#f0e8dd;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.day small{font-size:9px;line-height:1.4;min-height:13px;color:inherit;opacity:.8}
.day.complete{background:#d3e3e9;border-color:#8faab7;color:#415f70}
.day.partial{background:#e9f0f2;border-color:#b1c7d0;color:#587b8e}
.day.selected{outline:2px solid #8d6b50;outline-offset:2px}
.day.today{font-weight:750}.day:disabled{opacity:.3}
.habit-list{display:grid;gap:10px}
.habit-item{display:flex;gap:9px;align-items:center;padding:11px 12px;background:#f0e8dd;border:1px solid #b1c7d0;border-radius:11px}
.habit-item .habit-main{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.habit-item .habit-main span:last-child{overflow-wrap:anywhere}
.habit-item .muted{font-size:10px}
.habit-item.done{background:#e9f0f2;border-color:#b1c7d0}
.habit-item.done .check-bubble{background:#628092;color:#fffaf4;border-color:#628092}
.note-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.note{min-height:215px;background:#faf4e9;border:1px solid #deceb9;border-radius:16px;padding:22px;position:relative}
.note.important{background:#edf1f0;border-color:#95adb8;box-shadow:inset 0 4px #698c9d}
.note h3{margin:13px 0 10px;overflow-wrap:anywhere;color:#574334}
.note p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.9;color:#8a7768}
.note-actions{display:flex;justify-content:space-between;gap:8px;margin-top:25px;align-items:center}
.note-actions button[aria-pressed=true]{color:#fffaf4;border-color:#628092;background:#628092}
.note .pin{position:absolute;right:17px;top:12px;color:#8c6e50;font-size:18px}
.footer{margin-top:20px;padding:15px 1px;border-top:1px solid #e2d8cb;display:flex;justify-content:space-between;gap:12px;font-size:9px;color:#8a7768}
.local-status{padding:12px 15px;border:1px solid #e2d8cb;border-radius:12px;background:#f0e8dd;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:10px;color:#8a7768;margin-top:26px}
.local-status button{padding:5px 9px;font-size:10px;background:transparent;white-space:nowrap}
.local-status.error{background:#fff4ef;color:#a2513b;border-color:#e5b6a5}
.dialog{border:1px solid #b1c7d0;border-radius:21px;padding:27px;box-shadow:0 25px 90px #5c463b20;width:min(650px,calc(100% - 30px));max-height:90vh;overflow:auto;color:var(--ink);background:#fffdf8}
.dialog::backdrop{background:#624e3c44;backdrop-filter:blur(6px)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}
.dialog .hint{font-size:10px;color:#8a7768;margin:12px 0;line-height:1.9}
.toast{position:fixed;bottom:27px;left:calc(50% + 116px);transform:translateX(-50%);background:#5e493b;border:1px solid #b1c7d0;color:#fffdf8;border-radius:12px;padding:11px 21px;z-index:100;box-shadow:0 6px 25px #5c463b20;font-size:12px;max-width:90vw;pointer-events:none}
.hidden{display:none!important}
.inline-add{display:flex;gap:9px;margin-top:17px}.inline-add input{flex:1}
.page-description{font-size:12px;color:#8a7768;margin:6px 0 19px}
.amount-minus{color:#8a7768}.amount-plus{color:#587b8e}
.mini-metrics{display:flex;gap:28px;margin-bottom:19px;flex-wrap:wrap}
.mini-metrics strong{display:block;font-size:29px;color:#587b8e;font-variant-numeric:tabular-nums}
.mini-metrics small{font-size:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

function svgChart(s){const w=600,h=235,left=48,top=18,bottom=192,right=584;let out=`<svg viewBox="0 0 ${w} ${h}" role="presentation" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif"><g fill="#8a7768" font-size="11">`;if(s.type==='doughnut'){const total=sum(s.values,v=>v||0),cx=190,cy=107,r=73,c=2*Math.PI*r;out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eee7db" stroke-width="26"/>`;let offset=0;s.values.forEach((v,i)=>{const length=total?v/total*c:0;if(length){out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${palette[i]}" stroke-width="26" stroke-dasharray="${length} ${c-length}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.labels[i])}：${money(v)} 元，${num(v/total*100)}%</title></circle>`;offset+=length}out+=`<rect x="327" y="${31+i*34}" width="10" height="10" rx="3" fill="${palette[i]}"/><text x="348" y="${41+i*34}">${esc(s.labels[i])}　${total?num(v/total*100,1):0}%　¥${money(v)}</text>`});out+=`<text x="190" y="105" text-anchor="middle" font-size="12">${total?'本月总支出':'暂无支出记录'}</text><text x="190" y="130" text-anchor="middle" font-size="23" fill="#587b8e">¥${money(total)}</text>`}else{const vals=s.values.filter(v=>v!==null),max=vals.length?Math.max(...vals):1,min=vals.length?Math.min(...vals):0,lo=s.type==='line'?Math.max(0,min-2):0,hi=Math.max(lo+1,s.type==='line'?max+2:max*1.18),y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top),spacing=(right-left)/s.labels.length,x=i=>left+spacing*(i+.5);for(let i=0;i<=4;i++){const yy=top+(bottom-top)*i/4;out+=`<line x1="${left}" y1="${yy}" x2="${right}" y2="${yy}" stroke="#e7ded1"/><text x="${left-9}" y="${yy+4}" text-anchor="end">${num(hi-(hi-lo)*i/4,1)}</text>`}s.labels.forEach((label,i)=>{out+=`<text x="${x(i)}" y="215" text-anchor="middle">${esc(label)}</text>`});s.values.forEach((v,i)=>{if(v===null)return;const xx=x(i),yy=y(v);if(s.type==='bar')out+=`<rect x="${xx-Math.min(38,spacing*.6)/2}" y="${yy}" width="${Math.min(38,spacing*.6)}" height="${Math.max(0,bottom-yy)}" rx="5" fill="${s.color}"><title>${esc(s.labels[i])}：${v} ${s.unit}</title></rect><text x="${xx}" y="${yy-7}" text-anchor="middle">${num(v,1)}</text>`;else{if(i>0&&s.values[i-1]!==null)out+=`<line x1="${x(i-1)}" y1="${y(s.values[i-1])}" x2="${xx}" y2="${yy}" stroke="${s.color}" stroke-width="3"/>`;out+=`<circle cx="${xx}" cy="${yy}" r="4" fill="${s.color}" stroke="#ffffff" stroke-width="2"><title>${esc(s.labels[i])}：${v} ${s.unit}</title></circle><text x="${xx}" y="${yy-11}" text-anchor="middle">${num(v)}</text>`}});if(!vals.length)out+='<text x="316" y="107" text-anchor="middle" fill="#8a7768">等待第一条记录，让进步留下足迹</text>'}return out+'</g></svg>'}

/* 交互层：使用事件委托；用户输入一律作为文本转义，避免便签等内容注入 HTML。 */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo({top:0,behavior:'instant'});return}const {action,id,date,collection}=b.dataset;switch(action){case'settings':settings();break;case'close-modal':closeModal();break;case'today':viewDate=today;calendarMonth=today.slice(0,7);render();break;case'export':exportData();break;case'review-tab':reviewTab=b.dataset.tab;render();break;case'new-note':noteModal();break;case'edit-note':noteModal(id);break;case'pin-note':{const n=db.notes.find(n=>n.id===id);n.important=!n.important;commit(n.important?'重要便签已置顶':'已取消置顶');break}case'new-subject':subjectModal();break;case'edit-subject':subjectModal(id);break;case'new-stage':stageModal();break;case'check':{const h=db.habits.find(x=>x.id===id);if(!h||viewDate<h.created||viewDate>today)return;const checked=db.checks[viewDate]||[];db.checks[viewDate]=checked.includes(id)?checked.filter(x=>x!==id):[...checked,id];commit(checked.includes(id)?'已取消这次打卡':'又一朵小花，为你的坚持开放 ✿');break}case'calendar':{const d=asDate(calendarMonth+'-01');d.setMonth(d.getMonth()+Number(b.dataset.delta));calendarMonth=dateKey(d).slice(0,7);render();break}case'calendar-day':viewDate=date;render();break;case'delete-habit':if(confirm('删除这个习惯及它的所有打卡记录？')){db.habits=db.habits.filter(x=>x.id!==id);for(const d in db.checks)db.checks[d]=db.checks[d].filter(x=>x!==id);if(habitFilter===id)habitFilter='all';commit('习惯已删除')}break;case'delete-subject':if(confirm('删除这个科目及其全部学习时长记录？此操作不可撤销。')){db.subjects=db.subjects.filter(x=>x.id!==id);db.study=db.study.filter(x=>x.subject!==id);closeModal();commit('科目与关联学习记录已删除')}break;case'delete-record':if(['transactions','tasks','study','notes','stages'].includes(collection)&&confirm('确定删除这条记录？')){db[collection]=db[collection].filter(x=>x.id!==id);commit('记录已删除')}break;case'day-detail':dayDetail(date);break;case'delete-detail':if(['weights','meals'].includes(collection)&&confirm('确定删除这条记录？')){db[collection]=db[collection].filter(x=>x.id!==id);closeModal();commit('记录已删除');dayDetail(date)}break;case'delete-weight-day':if(confirm(`删除 ${date} 的全部体重和饮食记录？`)){db.weights=db.weights.filter(x=>x.date!==date);db.meals=db.meals.filter(x=>x.date!==date);commit('当日记录已删除')}break}});
document.addEventListener('change',e=>{if(e.target.id==='viewDate'){const v=e.target.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v>today){e.target.value=viewDate;toast('请选择今天或过去的日期');return}viewDate=v;calendarMonth=v.slice(0,7);render()}else if(e.target.id==='habitFilter'){habitFilter=e.target.value;render()}else if(e.target.dataset.task){const t=db.tasks.find(x=>x.id===e.target.dataset.task);if(t){t.done=e.target.checked;commit(t.done?'任务完成，给自己一个小小的赞 ♡':'任务已恢复为待完成')}}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form)),kind=form.dataset.form;for(const k in f)if(typeof f[k]==='string')f[k]=f[k].trim();const numeric=(key,min,max)=>Number.isFinite(Number(f[key]))&&f[key]!==''&&Number(f[key])>=min&&Number(f[key])<=max;const base={id:uid(),date:viewDate,created:Date.now()};switch(kind){case'weight':if(!numeric('value',1,500))return;{const existing=db.weights.find(x=>x.date===viewDate&&x.slot===f.slot);if(existing)Object.assign(existing,{value:Number(f.value),note:f.note});else db.weights.push({...base,slot:f.slot,value:Number(f.value),note:f.note})}break;case'meal':if(!f.food||!numeric('calories',0,20000))return toast('请填写食物名称和热量');db.meals.push({...base,type:f.type,food:f.food,calories:Number(f.calories)});break;case'transaction':if(!numeric('amount',.01,99999999))return;db.transactions.push({...base,type:f.type,category:f.category,amount:Math.round(Number(f.amount)*100)/100,note:f.note});break;case'task':if(!f.text)return toast('请先写下任务内容');db.tasks.push({...base,text:f.text,done:false});break;case'study':if(!db.subjects.some(s=>s.id===f.subject)||!numeric('minutes',1,1440))return;if(learning(viewDate)+Number(f.minutes)>1440)return toast('同一天的学习时长不能超过 24 小时');db.study.push({...base,subject:f.subject,minutes:Number(f.minutes),note:f.note});break;case'habit':if(!f.name)return toast('请先填写习惯名称');if(db.habits.some(h=>h.name===f.name))return toast('这个习惯已经在花园里啦');db.habits.push({id:uid(),name:f.name,icon:'✿',created:today});break;case'note':if(!f.title||!f.content)return toast('请填写标题和便签内容');{const existing=db.notes.find(n=>n.id===f.id),note={title:f.title,content:f.content,important:f.important==='on',updated:Date.now()};if(existing)Object.assign(existing,note);else db.notes.push({id:uid(),...note})}closeModal();break;case'settings':if(!f.nickname)return toast('请填写昵称');db.profile={nickname:f.nickname,height:Number(f.height),startWeight:Number(f.startWeight),targetWeight:Number(f.targetWeight),budget:Number(f.budget),savingGoal:Number(f.savingGoal),openingSavings:Number(f.openingSavings),exam:f.exam};closeModal();break;case'subject':if(!f.name)return toast('请填写科目名称');{const existing=db.subjects.find(s=>s.id===f.id),subject={name:f.name,hours:Number(f.hours),deadline:f.deadline,remaining:f.remaining};if(existing)Object.assign(existing,subject);else db.subjects.push({id:uid(),...subject})}closeModal();break;case'stage':if(!f.name||f.end<f.start)return toast('请填写阶段名称，并确保结束日期不早于开始日期');db.stages.push({id:uid(),name:f.name,start:f.start,end:f.end});closeModal();break;default:return}commit()});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
// 首次保存默认计划，保证习惯 ID 与创建日期在刷新后稳定。
if(storageOk)persist();render();
// 异步加载 Chart.js 官方发行包（官方文档推荐的 jsDelivr 地址）；失败不影响本地功能。
const chartScript=document.createElement('script');chartScript.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js';chartScript.async=true;chartScript.onload=renderCharts;chartScript.onerror=()=>{$('#chartMode').textContent='离线图表已就绪 · 数据仅在本地留存'};document.head.append(chartScript);
// 跨午夜自动更新“今天”，历史查看日期则保持不变。
setInterval(()=>{const next=dateKey();if(next!==today){if(viewDate===today){viewDate=next;calendarMonth=next.slice(0,7)}today=next;render()}},30000);
</script>
</body>
</html>
